name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Show import formatting suggestions
        run: python -m ruff check tests/test_api.py --select I001 --fix --diff || true
      - name: Static lint
        run: python -m ruff check src tests
      - name: Metadata inventory smoke test
        shell: pwsh
        run: |
          $report = ./scripts/inventory_metadata.ps1 -Roots @("tests") -MaxFilesPerRoot 100 -MaxMinutesPerRoot 1 | ConvertFrom-Json
          if ($report.analysis_type -ne "metadata_only" -or $report.source_summaries[0].inspected_files -lt 1) {
            throw "The inventory script did not produce the expected safe summary."
          }
